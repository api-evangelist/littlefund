name: LittleFund
description: >-
  LittleFund (styled Littlefund) was a New York City-based consumer fintech
  mobile app that let families create long-term savings and gift funds for
  their children. Instead of physical presents, relatives and friends could
  contribute money toward a child's fund for birthdays, holidays, and
  milestones, with funding from bank accounts or credit/debit cards and
  savings goals tracked in-app. The company was backed by 500 Global (500
  Startups) and was acquired by UNest, a children's investment and savings
  platform, around 2020. LittleFund operated as a B2C mobile product and never
  published a public developer platform, API, or documentation. Its original
  site at littlefund.co is offline and littlefund.com is now a parked domain;
  this record is retained as a historical company profile in the API
  Evangelist network.
